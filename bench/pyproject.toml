[project]
name = "harness-bench"
version = "0.0.1"
description = "harness-fe vs Chrome DevTools MCP vs code-only — bug-fixing benchmark for Claude Code (see docs/design/harness-bench-*.md)"
requires-python = ">=3.11"
dependencies = [
    "inspect-ai>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["bench*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
