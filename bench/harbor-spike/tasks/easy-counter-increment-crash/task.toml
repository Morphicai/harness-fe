version = "1.0"

[task]
name = "harness-bench-spike/easy-counter-increment-crash"
authors = [{ name = "Morphicai" }]
keywords = ["frontend", "react", "browser-oracle", "spike"]
description = "Topology spike for harness-bench on Harbor: vite app + injected UI bug + headless-Chromium oracle + shared verifier + multi-metric reward."

[metadata]
difficulty = "easy"
category = "frontend-bug"
tags = ["spike", "harness-bench"]

[verifier]
timeout_sec = 600.0
# 关键行：verifier 与 agent 共享同一容器/文件系统，否则 oracle 看不到
# agent（或 solve.sh）修过的代码，会全盘误判。
environment_mode = "shared"

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 2400.0
cpus = 2
memory_mb = 6144
storage_mb = 20480
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]

[solution.env]
