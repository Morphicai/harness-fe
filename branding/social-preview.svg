<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#818cf8"/>
      <stop offset="45%"  stop-color="#34d399"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <radialGradient id="spot" cx="20%" cy="30%" r="60%">
      <stop offset="0%"   stop-color="#818cf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot2" cx="85%" cy="80%" r="55%">
      <stop offset="0%"   stop-color="#fb7185" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1f1f23" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGlow)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#spot)"/>
  <rect width="1280" height="640" fill="url(#spot2)"/>

  <!-- Logo block, left -->
  <g transform="translate(96 188)">
    <rect width="180" height="180" rx="36" fill="url(#ring)"/>
    <rect x="8" y="8" width="164" height="164" rx="28" fill="#09090b"/>
    <g fill="#fafafa">
      <rect x="54" y="50"  width="18" height="80" rx="3"/>
      <rect x="108" y="50" width="18" height="80" rx="3"/>
      <rect x="54" y="81"  width="72" height="18" rx="3"/>
    </g>
  </g>

  <!-- Text block, right -->
  <g transform="translate(330 0)">
    <text x="0" y="232" font-size="44" font-weight="600" fill="#a1a1aa" letter-spacing="0.04em">HARNESS-FE</text>

    <text x="0" y="316" font-size="64" font-weight="700" fill="#e4e4e7" letter-spacing="-0.01em">
      The agent that built it
    </text>
    <text x="0" y="386" font-size="64" font-weight="700" fill="url(#ring)" letter-spacing="-0.01em">
      never leaves.
    </text>

    <text x="0" y="450" font-size="22" font-weight="400" fill="#a1a1aa">
      A source-aware harness for every AI-built app —
    </text>
    <text x="0" y="480" font-size="22" font-weight="400" fill="#a1a1aa">
      build plugins, MCP daemon, runtime client.
    </text>

    <g transform="translate(0 532)">
      <rect x="0"   y="0" width="14" height="14" rx="3" fill="#818cf8"/>
      <text x="22"  y="12" font-size="16" fill="#71717a">Vite</text>
      <rect x="86"  y="0" width="14" height="14" rx="3" fill="#34d399"/>
      <text x="108" y="12" font-size="16" fill="#71717a">Webpack</text>
      <rect x="200" y="0" width="14" height="14" rx="3" fill="#fb7185"/>
      <text x="222" y="12" font-size="16" fill="#71717a">Next.js</text>
      <rect x="304" y="0" width="14" height="14" rx="3" fill="#fbbf24"/>
      <text x="326" y="12" font-size="16" fill="#71717a">MCP</text>
      <rect x="378" y="0" width="14" height="14" rx="3" fill="#818cf8"/>
      <text x="400" y="12" font-size="16" fill="#71717a">Claude · Cursor · Kiro</text>
    </g>
  </g>

  <!-- Footer hairline -->
  <rect x="96" y="588" width="1088" height="1" fill="#1f1f23"/>
  <text x="96"   y="618" font-size="14" fill="#71717a">github.com/Morphicai/harness-fe</text>
  <text x="1184" y="618" font-size="14" fill="#71717a" text-anchor="end">MIT licensed</text>
</svg>
