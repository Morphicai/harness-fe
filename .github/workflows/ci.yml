name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: Lint / Typecheck / Test / Build
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            # Pinned to commit SHA — never use floating @v4 tags for third-party actions.
            # See: https://blog.gitguardian.com/github-actions-security-best-practices/
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Setup pnpm
              uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
              with:
                  version: 9.15.0
                  run_install: false

            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: '20'
                  cache: 'pnpm'

            - name: Install dependencies
              # --ignore-scripts blocks postinstall hooks — primary vector for the
              # Shai-Hulud worm and most npm supply-chain attacks since 2024.
              # Lockfile is frozen to prevent silent version drift.
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Verify dependency signatures
              # Validates that every installed tarball was signed by its registry.
              # Catches tampered packages that slipped past the lockfile hash check.
              run: pnpm audit signatures || echo "::warning::audit signatures reported issues"

            - name: Typecheck
              run: pnpm typecheck

            - name: Build
              run: pnpm build

            - name: Test
              run: pnpm test
