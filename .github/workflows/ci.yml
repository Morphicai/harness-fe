name: CI

on:
    push:
        branches: [main, next]
    pull_request:
        branches: [main, next]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: Lint / Typecheck / Test / Build
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            # Pinned to commit SHA — never use floating @v4 tags for third-party actions.
            # See: https://blog.gitguardian.com/github-actions-security-best-practices/
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Guard — no Changesets prerelease marker on main
              # `.changeset/pre.json` is the 4.0 `next` line's prerelease marker.
              # If it ever lands on main, main's releases silently become
              # prereleases. Allowed on `next`; forbidden on `main`. (base_ref =
              # PR target branch; ref_name = pushed branch.)
              if: github.base_ref == 'main' || (github.event_name == 'push' && github.ref_name == 'main')
              run: |
                  if [ -f .changeset/pre.json ]; then
                      echo "::error::.changeset/pre.json must not exist on main — it is the 4.0 'next' prerelease marker. Remove it before merging to main."
                      exit 1
                  fi
                  echo "ok: no .changeset/pre.json on main"

            - name: Setup pnpm
              uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
              with:
                  version: 9.15.0
                  run_install: false

            - name: Setup Node.js
              uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
              with:
                  node-version: '20'
                  cache: 'pnpm'

            - name: Install dependencies
              # --ignore-scripts blocks postinstall hooks — primary vector for the
              # Shai-Hulud worm and most npm supply-chain attacks since 2024.
              # Lockfile is frozen to prevent silent version drift.
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Verify dependency signatures
              # Validates every installed tarball was signed by its registry.
              # `pnpm audit signatures` is not implemented (pnpm falls back to vuln audit);
              # `npm audit signatures` is the real one. Non-blocking: lockfile already
              # pins SHA512 hashes for every package.
              run: npm audit signatures || echo "::warning::audit signatures reported issues"

            - name: Typecheck
              run: pnpm typecheck

            - name: Build
              run: pnpm build

            - name: Test
              run: pnpm test

    e2e:
        name: E2E (real browser)
        runs-on: ubuntu-latest
        timeout-minutes: 20
        # The unit suite never exercises the injected page, so the e2e specs
        # silently rotted for several releases (a hello frame missing a
        # now-required field, an assertion on a specifier the plugin stopped
        # emitting, selectors that moved to routed demo pages). Nothing caught
        # it because CI only ran `pnpm test`. It runs them now.

        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Setup pnpm
              uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
              with:
                  version: 9.15.0
                  run_install: false

            - name: Setup Node.js
              uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
              with:
                  node-version: '20'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Install Playwright chromium
              # --with-deps pulls the system libs headless chromium needs on
              # ubuntu-latest. Only chromium: the specs never touch the others.
              run: pnpm --filter harness-fe-react-demo exec playwright install --with-deps chromium

            - name: Build
              run: pnpm build

            - name: E2E
              run: pnpm e2e
