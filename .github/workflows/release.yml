name: Release

# Changesets-driven release flow.
#
# On every push to main, this workflow either:
#   (a) opens / updates a "Version Packages" PR that, when merged, will bump
#       package.json versions and consume all pending .changeset/*.md files,
#       OR
#   (b) if the Version Packages PR was just merged (i.e. there are bumped
#       versions and no remaining changesets), publishes the affected
#       packages to npm via scripts/release-publish.sh.
#
# How to ship a change:
#   1. In your feature PR run `pnpm changeset` to declare which packages
#      changed and at what semver level. Commit the generated
#      .changeset/<name>.md file.
#   2. Merge the feature PR into main.
#   3. This workflow opens/updates a "Version Packages" PR with all
#      pending bumps. Review the diff, then merge it.
#   4. On that merge, the workflow flips into publish mode and ships.

on:
    push:
        branches:
            - main   # the stable line → npm dist-tag `latest`
            # (the 4.0 `next` prerelease line graduated to `main`; a future
            #  5.0 line will re-add a `next` trigger + Changesets pre mode.)

permissions:
    contents: write
    pull-requests: write
    id-token: write
    # Needed to post the required `Lint / Typecheck / Test / Build` status onto
    # the auto-generated Version Packages PR — see the final step below.
    statuses: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        name: Version PR / Publish
        runs-on: ubuntu-latest
        timeout-minutes: 20
        # Note: no `environment:` gate. With Changesets the human review step
        # is the auto-opened "Version Packages" PR — you read the diff and
        # merge to ship. The old `release` environment (manual reviewer
        # required) was a tag-push safeguard that is now redundant and
        # rejected `main` pushes here. If you want a second-pair-of-eyes
        # check beyond the Version PR, re-enable `environment: release` and
        # add `main` to the environment's allowed branches.

        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
              with:
                  version: 9.15.0
                  run_install: false

            - name: Setup Node.js
              uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
              with:
                  node-version: '20'
                  cache: 'pnpm'
                  registry-url: 'https://registry.npmjs.org'
                  scope: '@harness-fe'

            - name: Upgrade npm CLI for OIDC trusted publishing
              # npm ≥ 11.5 properly negotiates trusted publishing when no
              # token is in the env; older npm in pass A would emit
              # provenance fine but couldn't auth without a token.
              #
              # Pinned to the npm 11 line, NOT `@latest`: npm 12 requires
              # Node ^22.22.2 || ^24.15.0 || >=26, which broke this step
              # outright (EBADENGINE) against the node-version: '20' pinned
              # above. npm 11.x only needs Node ^20.17.0 || >=22.9.0.
              run: |
                  npm install -g npm@11
                  npm --version

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Verify dependency signatures
              run: npm audit signatures || echo "::warning::audit signatures reported issues"

            - name: Typecheck
              run: pnpm typecheck

            - name: Build
              run: pnpm build

            - name: Test
              run: pnpm test

            - name: Open Version PR or publish
              id: changesets
              uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.4.10
              with:
                  # `version`: run when there ARE pending changesets — this
                  # opens / updates the "Version Packages" PR.
                  version: pnpm version-packages
                  # `publish`: run when there are NO pending changesets
                  # (= Version PR was just merged) and at least one package
                  # has a version that isn't on npm yet.
                  publish: pnpm release
                  commit: "chore(release): version packages"
                  title: "chore(release): version packages"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
                  # Single stable line: `main` publishes to `latest`. (When a
                  # future 5.0 `next` prerelease line is opened, restore the
                  # dual-line `ref_name == 'next' ? 'next' : 'latest'` logic.)
                  NPM_DIST_TAG: latest

            # The Version Packages PR is opened by GITHUB_TOKEN, so GitHub's
            # anti-recursion rule means it never triggers the CI workflow —
            # the `Lint / Typecheck / Test / Build` required status check would
            # otherwise never appear and the PR stays permanently BLOCKED.
            #
            # This job already ran the exact same Typecheck/Build/Test above
            # (failure aborts before reaching here), and the bot branch only
            # adds mechanical version/CHANGELOG bumps on top of this verified
            # main commit. So mirror that result onto the bot branch HEAD under
            # the required context. Only runs in "version PR" mode, never on a
            # publish run.
            - name: Mark Version PR required check
              if: steps.changesets.outputs.published != 'true' && steps.changesets.outputs.hasChangesets == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  BOT_BRANCH="changeset-release/${{ github.ref_name }}"
                  git fetch origin "$BOT_BRANCH"
                  SHA=$(git rev-parse "origin/${BOT_BRANCH}")
                  echo "Reporting required check on ${BOT_BRANCH} @ ${SHA}"
                  gh api -X POST "repos/${{ github.repository }}/statuses/${SHA}" \
                      -f state=success \
                      -f context="Lint / Typecheck / Test / Build" \
                      -f description="Verified in Release workflow (version bumps only)" \
                      -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

            - name: Create GitHub Release
              # Only run when changesets/action actually published.
              if: steps.changesets.outputs.published == 'true'
              uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
              with:
                  generate_release_notes: true
                  body_path: ${{ github.workspace }}/CHANGELOG.md
                  draft: false
