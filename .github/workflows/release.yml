name: Release

# Trigger only on annotated tag push matching v*.*.*
# Tag protection rules in repo settings should restrict who can push tags.
on:
    push:
        tags:
            - 'v*.*.*'

# Strict least-privilege.
#   id-token: write → required for OIDC / npm provenance
#   contents: write → required by softprops/action-gh-release to create a release
permissions:
    contents: write
    id-token: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    publish:
        name: Publish to npm
        runs-on: ubuntu-latest
        timeout-minutes: 20

        # Require manual approval via a protected environment.
        # Configure in repo Settings → Environments → "release":
        #   - required reviewers (you)
        #   - branch restriction: tags matching v*.*.*
        environment:
            name: release
            url: https://www.npmjs.com/org/harnessa-fe

        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
              with:
                  version: 9.15.0
                  run_install: false

            - name: Setup Node.js
              uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
              with:
                  node-version: '20'
                  cache: 'pnpm'
                  registry-url: 'https://registry.npmjs.org'
                  scope: '@harnessa-fe'

            - name: Upgrade npm CLI for OIDC trusted publishing
              # Node 20 ships npm 10.9 which only does provenance via tokens.
              # Trusted publishing (no-token OIDC) needs npm ≥ 11.5.
              # See https://docs.npmjs.com/trusted-publishers
              run: |
                  npm install -g npm@latest
                  npm --version

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Verify dependency signatures
              # npm exposes the real signature-verify; pnpm aliases this to a plain audit.
              # Non-blocking: lockfile already pins SHA512 hashes per tarball.
              run: npm audit signatures || echo "::warning::audit signatures reported issues"

            - name: Typecheck
              run: pnpm typecheck

            - name: Build
              run: pnpm build

            - name: Test
              run: pnpm test

            - name: Verify tag matches package versions
              # Refuse to publish if the git tag (v0.1.0) does not match the version
              # in every package.json. Defends against accidental drift and against
              # an attacker who pushes a tag without updating versions.
              run: |
                  TAG_VERSION="${GITHUB_REF_NAME#v}"
                  echo "Tag version: $TAG_VERSION"
                  for pkg in packages/*/package.json; do
                      PKG_VERSION=$(node -p "require('./$pkg').version")
                      if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
                          echo "::error::$pkg has version $PKG_VERSION but tag is $TAG_VERSION"
                          exit 1
                      fi
                  done
                  echo "✓ All packages match $TAG_VERSION"

            - name: Dry-run publish
              # Sanity check: ensure workspace:* deps rewrite correctly and tarballs are valid.
              run: pnpm -r --filter './packages/*' publish --dry-run --access public --no-git-checks

            - name: Pack all packages into tarballs
              # pnpm pack rewrites `workspace:*` deps onto their real version
              # numbers inside each generated .tgz — same magic as pnpm publish
              # but stops short of the actual upload. pnpm 9 has no recursive
              # `pack` subcommand, so we loop. `npm publish` consumes the
              # tarballs next and brings OIDC into the picture.
              run: |
                  set -e
                  TARBALL_DIR="${{ github.workspace }}/tarballs"
                  mkdir -p "$TARBALL_DIR"
                  for pkg in packages/*/; do
                      ( cd "$pkg" && pnpm pack --pack-destination "$TARBALL_DIR" )
                  done
                  ls -la "$TARBALL_DIR"

            - name: Publish to npm with provenance (OIDC trusted publishing)
              # No NPM_TOKEN needed. npm CLI sees this GitHub Actions context
              # (id-token: write granted above + setup-node registry-url set)
              # and exchanges the workflow's OIDC id-token for a short-lived
              # publish credential, scoped to this workflow run + the npm
              # trusted-publisher config on each package.
              #
              # Trusted Publisher must be configured on npmjs.com for every
              # package, pointing to: Morphicai/harnessa-fe → release.yml →
              # environment "release".
              #
              # --provenance attaches a sigstore attestation linking each
              # tarball to this exact commit + workflow run. Verify with
              # `npm audit signatures` on the consumer side.
              env:
                  NPM_CONFIG_PROVENANCE: 'true'
              run: |
                  set -e
                  for tgz in "${{ github.workspace }}/tarballs"/*.tgz; do
                      echo ">>> publishing $tgz"
                      npm publish "$tgz" --access public --provenance
                  done

            - name: Create GitHub Release
              uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
              with:
                  generate_release_notes: true
                  body_path: ${{ github.workspace }}/CHANGELOG.md
                  draft: false
                  prerelease: ${{ contains(github.ref_name, '-') }}
