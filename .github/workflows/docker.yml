name: Docker

# Build and push the harness-fe gateway image to Docker Hub
# (morphixai/harness-fe).
#
# Triggers:
#   - Every time @harness-fe/cli publishes to npm (the changesets
#     release workflow finishes successfully on main or next). We detect
#     the freshly published version and tag the image accordingly.
#   - Manual workflow_dispatch with an explicit version + tag.
#
# Image tags applied:
#   stable release:  morphixai/harness-fe:<version>  +  morphixai/harness-fe:latest
#   next prerelease: morphixai/harness-fe:<version>  +  morphixai/harness-fe:next
#
# Multi-arch build (linux/amd64 + linux/arm64).
#
# Required repo secrets:
#   DOCKERHUB_USERNAME    a Docker Hub account with push to morphixai/*
#   DOCKERHUB_TOKEN       a Docker Hub PAT (Settings → Security → New token)

on:
    workflow_run:
        workflows: ["Release"]
        types:
            - completed
        branches:
            - main
            - next
    workflow_dispatch:
        inputs:
            version:
                description: '@harness-fe/cli version to image (e.g. 4.0.0 or 4.0.0-next.6)'
                required: true
                type: string
            dist_tag:
                description: 'npm dist-tag to resolve / publish Docker tag (latest or next)'
                required: false
                default: 'latest'
                type: string

permissions:
    contents: read

concurrency:
    group: docker-${{ github.ref }}
    cancel-in-progress: false

env:
    IMAGE: morphixai/harness-fe

jobs:
    build:
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
        runs-on: ubuntu-latest
        timeout-minutes: 40
        steps:
            - name: Resolve version and dist-tag
              id: ver
              run: |
                if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                  version="${{ inputs.version }}"
                  dist_tag="${{ inputs.dist_tag }}"
                else
                  # Detect which branch triggered the Release workflow.
                  branch="${{ github.event.workflow_run.head_branch }}"
                  if [ "$branch" = "next" ]; then
                    dist_tag="next"
                    version=$(npm view @harness-fe/cli@next version)
                  else
                    dist_tag="latest"
                    version=$(npm view @harness-fe/cli version)
                  fi
                fi
                if [ -z "$version" ]; then
                  echo "::error::could not resolve @harness-fe/cli version"
                  exit 1
                fi
                echo "version=$version" >> "$GITHUB_OUTPUT"
                echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
                echo "Building harness-fe v$version (dist-tag: $dist_tag)"

            - uses: actions/checkout@v4

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Skip if version already published
              id: exists
              run: |
                if docker buildx imagetools inspect "${IMAGE}:${{ steps.ver.outputs.version }}" > /dev/null 2>&1; then
                  echo "image already published for ${{ steps.ver.outputs.version }}, skipping"
                  echo "skip=true" >> "$GITHUB_OUTPUT"
                else
                  echo "skip=false" >> "$GITHUB_OUTPUT"
                fi

            - name: Build and push
              if: steps.exists.outputs.skip != 'true'
              uses: docker/build-push-action@v6
              with:
                  context: packages/cli
                  file: packages/cli/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  build-args: |
                      VERSION=${{ steps.ver.outputs.version }}
                      NPM_TAG=${{ steps.ver.outputs.dist_tag }}
                  tags: |
                      ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
                      ${{ env.IMAGE }}:${{ steps.ver.outputs.dist_tag }}
                  push: true
                  provenance: false
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
