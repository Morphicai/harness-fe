# harness-fe governed gateway — team deployment reference.
#
# Quick start:
#   1. cp .env.example .env  and fill in HARNESS_ADMIN_PASS + token secrets
#   2. docker compose up -d
#   3. Agent mcp.json: { "type": "http", "url": "http://<host>:47950/mcp",
#                        "headers": { "Authorization": "Bearer <agent-token>" } }
#   4. Build plugin: harnessFE({ mcpUrl: 'ws://<host>:47950/ws', token: '<runtime-token>' })
#
# Persistence: harness-data volume holds sessions, recordings, audit log,
# and token store. Mount a host path if you prefer:
#   - ./harness-data:/data

services:
  harness-fe:
    image: morphixai/harness-fe:latest
    container_name: harness-fe
    restart: unless-stopped
    ports:
      - "47950:47950"
    environment:
      HARNESS_HOST: "0.0.0.0"
      HARNESS_PORT: "47950"
      HARNESS_DATA_DIR: /data
      # Set in .env — printed in the gateway banner on first start.
      HARNESS_ADMIN_PASS: ${HARNESS_ADMIN_PASS:?required}
    command:
      - "--governed"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "47950"
      - "--admin-user"
      - "admin"
      - "--admin-pass"
      - "${HARNESS_ADMIN_PASS}"
      - "--data-dir"
      - "/data/gateway"
      - "--core-data-dir"
      - "/data/core"
      # Issue tokens at startup. Rotate via /admin panel after first run.
      - "--issue-token"
      - "name=runtime,scopes=write"
      - "--issue-token"
      - "name=agent,scopes=read+control,projects=*"
    volumes:
      - harness-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:47950/console/api/meta || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  harness-data:
